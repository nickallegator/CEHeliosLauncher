extends: './electron-builder.yml'

appId: 'net.allegator.games.launcher'
productName: 'Allegator Games Launcher'
executableName: 'AG Launcher'
artifactName: 'AG-Launcher-Standalone-Test-setup-${version}.${ext}'
copyright: 'Copyright © 2026 Allegator Games'

extraMetadata:
  version: '2.2.1-test.4'
  productName: 'Allegator Games Launcher'

extraResources:
  - from: 'dist/tester-staging/tester'
    to: 'tester'

win:
  target:
    - target: 'nsis'
      arch: 'x64'

directories:
  buildResources: 'build'
  output: 'dist/tester-output'
