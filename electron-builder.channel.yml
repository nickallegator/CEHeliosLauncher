extends: './electron-builder.yml'

appId: 'net.allegator.games.launcher'
productName: 'Allegator Games Launcher'
executableName: 'AG Launcher'
artifactName: 'AG-Launcher-Test-setup-${version}.${ext}'
copyright: 'Copyright (c) 2026 Allegator Games'

extraMetadata:
  productName: 'Allegator Games Launcher'

publish:
  provider: 'github'
  owner: 'nickallegator'
  repo: 'CEHeliosLauncher'
  releaseType: 'prerelease'

extraResources:
  - from: 'libraries'
    to: 'libraries'
  - from: 'dist/channel-staging/tester'
    to: 'tester'

win:
  target:
    - target: 'nsis'
      arch: 'x64'

directories:
  buildResources: 'build'
  output: 'dist/channel-output'
